name: Release
# 打 v* tag → 双架构 QPKG 发布(x86_64 / arm_64):
#   1. payload: 双架构静态二进制 + 前端 www(原生进程模式,免 Container Station)
#   2. package: QDK qbuild 组包 + 结构断言
#   3. release: 挂本仓 Release
#   4. attach-to-hub: 回挂生态主仓 pigeonbox/pigeonbox(tag qnap-v*,
#      与 fnos-v*/openwrt-v* 同模式);跨仓写用 QNAP_PAT
#      断链必须响(2026-10-08 拔除 continue-on-error——静默放行只会让 hub 统一出口缺资产)
# workflow_dispatch: 传 version(现有 tag 名)对该版本手动重跑打包+双挂
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '目标版本(现有 tag 名,如 v1.14.4)。仅重跑 QPKG 打包+双挂'
        required: true
        type: string

concurrency:
  # 手动 dispatch 重跑与 tag 自动触发可能并发写同一 Release(--clobber:先写者被
  # 静默覆盖,不报错)。按目标版本分组串行;cancel-in-progress:false——发布中途
  # 取消比排队更糟。键取目标版本而非 github.ref:dispatch 的 ref 是分支、
  # tag 触发的 ref 是 tag,用 ref 分组等于没分组。
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# 默认只读;真正要写本仓 Release 的作业在作业级单独开 contents: write
permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.mod 的
      # toolchain 地板再抬时，Go 能自动拉取而不是构建失败（2026-10-26 实测：
      # 浮动 go-version 拿到低于地板的 patch ⇒ 直接构建失败，门禁变噪声）。
      GOTOOLCHAIN: auto
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 手动 dispatch 时按输入版本检出对应 tag,产物与 tag 严格一致
          ref: ${{ inputs.version || github.ref_name }}
      - name: 版本一致性断言(VERSION 与 tag 对齐;go.mod core 钉版与 DEPS.env CORE_PIN 对齐)
        run: |
          VER=${{ inputs.version || github.ref_name }}
          if [ -f VERSION ]; then
            [ "$(cat VERSION)" = "${VER#v}" ] || { echo "::error::VERSION=$(cat VERSION) ≠ tag $VER——发版走 hub 列车 bump,勿手改 VERSION"; exit 1; }
            . ./DEPS.env
            grep -q "github.com/pigeonbox/core ${CORE_PIN}" go.mod || { echo "::error::go.mod core 钉版 ≠ DEPS.env CORE_PIN=${CORE_PIN}(列车 2.1.0 静默不一致实锤:DEPS 声称新钉而二进制实为旧 core 构建——版本幽灵守卫)"; exit 1; }
          fi
      # 前端自包含在本仓 web/(frontend-core tgz 钉版=web/package.json),无需读壳仓 ref
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 原生产物构建(双架构二进制+前端,版本注入)
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: ./scripts/build-native.sh
      # pb CLI 随包门禁（**发布流水线硬断言**）
      #
      # 为什么断言放在 release 而不是 CI：
      #   · CI（bump PR）阶段 server 的同号 tag **还不存在** ⇒ pb 编不出来是预期的
      #     ⇒ 那里硬断会让 bump PR 合不进去 ⇒ 列车死锁；
      #   · release（tag push）阶段 server tag **已可见**（hub#232 加了
      #     「server 之后等 tag 可见」的顺序保证）⇒ pb 必定编得出
      #     ⇒ 这里才是「**发布出去的包必须含 pb**」的真正断言点。
      - name: pb CLI 随包门禁（发布流水线硬断言）
        run: PB_REQUIRED=1 bash scripts/check-pb-in-qpkg.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: payload
          path: qpkg/
          retention-days: 7
          if-no-files-found: error

  package:
    needs: payload
    strategy:
      matrix:
        arch: [x86_64, arm_64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: payload
          path: qpkg/
      - name: 安装 QDK(官方打包器)与依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dos2unix rsync
          # QDK 是第三方打包器,钉到具体提交——取分支头=每次构建拿到的可能是
          # 不同工具版本(与 fnpack 同类问题:打包产物随第三方漂移)。
          QDK_REF=b7b5f4c86ebe95b10a62d64725515e7cdcf4bb35
          git init -q /tmp/QDK
          git -C /tmp/QDK remote add origin https://github.com/qnap-dev/QDK.git
          git -C /tmp/QDK fetch -q --depth 1 origin "$QDK_REF"
          git -C /tmp/QDK checkout -q FETCH_HEAD
          (cd /tmp/QDK && sudo ./InstallToUbuntu.sh install)
      - name: qbuild 组包(tag v1.14.4 → QPKG_VER 1.14.4)
        run: |
          VER="${{ inputs.version || github.ref_name }}"
          ./scripts/build-qpkg.sh ${{ matrix.arch }} "${VER#v}"
      - name: 结构断言(自解压头/payload 关键文件/图标/md5 侧车)
        run: |
          VER="${{ inputs.version || github.ref_name }}"
          QPKG=dist/PigeonBox_${VER#v}_${{ matrix.arch }}.qpkg
          test -s "$QPKG"
          [ "$(head -c 9 "$QPKG")" = "#!/bin/sh" ]
          grep -q "control.tar" "$QPKG" && grep -q "data.tar.gz" "$QPKG"
          test -f "${QPKG}.md5" && (cd dist && md5sum -c "$(basename "${QPKG}").md5")
          # payload 抽取(桩内 data 段偏移=script_len+control 段大小):
          # 二进制/前端/服务脚本/env 模板/图标须在包根(QDK shared 平铺布局)
          SLEN=$(grep -aoE '^script_len=[0-9]+' "$QPKG" | head -1 | cut -d= -f2)
          CTL=$(grep -aoE 'script_len \+ [0-9]+' "$QPKG" | head -1 | grep -oE '[0-9]+$')
          dd if="$QPKG" bs=$((SLEN + CTL)) skip=1 of=/tmp/data.tar.gz
          tar -tzf /tmp/data.tar.gz | grep -q 'bin/pigeonbox-linux-'
          tar -tzf /tmp/data.tar.gz | grep -q '^\./www/index\.html$'
          tar -tzf /tmp/data.tar.gz | grep -q '^\./pigeonbox\.sh$'
          tar -tzf /tmp/data.tar.gz | grep -q '^\./env\.example$'
          tar -tzf /tmp/data.tar.gz | grep -q '^\./\.qpkg_icon\.gif$'
          # 尺寸守卫:含二进制+www 的 QPKG 至少 10MB（防截断包/空壳包过闸——
          # tar -tzf 对截断 gzip 仍可列出索引,单靠 grep 骗得过）
          QPKG_SIZE=$(stat -c%s "$QPKG")
          [ "$QPKG_SIZE" -ge 10485760 ] || { echo "::error::QPKG 仅 ${QPKG_SIZE}B(<10MB),疑似截断"; exit 1; }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qpkg-${{ matrix.arch }}
          path: |
            dist/*.qpkg
            dist/*.md5
          retention-days: 14
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qpkg-x86_64
          path: rel
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qpkg-arm_64
          path: rel
      - name: 挂本仓 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ github.ref_name }}
        run: |
          gh release view "${VER}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${VER}" --repo "${GITHUB_REPOSITORY}" \
              --title "PigeonBox QNAP QTS ${VER}" \
              --notes "威联通 QTS 原生应用包(QPKG,见 Assets,x86_64/arm_64 双架构)。原生进程模式:包内自带二进制与前端,免 Container Station/免 Docker(要求 QTS 4.5+)。安装:App Center 右上角手动安装 → 上传 QPKG;未签名包需先在 App Center → 设置允许安装无签名应用。详见 README。"
          gh release upload "${VER}" rel/*.qpkg rel/*.md5 --repo "${GITHUB_REPOSITORY}" --clobber

  attach-to-hub:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qpkg-x86_64
          path: rel
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qpkg-arm_64
          path: rel
      - name: 回挂包到生态主仓
        env:
          GH_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
          TAG: qnap-${{ inputs.version || github.ref_name }}
          VER: ${{ inputs.version || github.ref_name }}
        run: |
          NOTES=$(printf '%s\n\n---\n🗂 **组件仓库**: [pigeonbox/qnap](https://github.com/pigeonbox/qnap) · **完整变更日志**: [%s](https://github.com/pigeonbox/qnap/releases/tag/%s)\n🌐 **生态总览 / Latest**: [pigeonbox/pigeonbox](https://github.com/pigeonbox/pigeonbox/releases/latest)\n' \
            "威联通 QTS 原生应用包(QPKG,x86_64/arm_64,免 Container Station,要求 QTS 4.5+)。安装说明见 qnap 仓 README。" "${VER}" "${VER}")
          gh release view "${TAG}" --repo pigeonbox/pigeonbox >/dev/null 2>&1 || \
            gh release create "${TAG}" --repo pigeonbox/pigeonbox \
              --title "PigeonBox QNAP QTS ${VER}" \
              --latest=false \
              --notes "${NOTES}"
          gh release upload "${TAG}" rel/*.qpkg rel/*.md5 --repo pigeonbox/pigeonbox --clobber
          # 组件回挂恒不为 Latest(Latest 属于 hub 生态快照 v*);release 已存在时也兜底纠偏
          gh release edit "${TAG}" --repo pigeonbox/pigeonbox --latest=false || true
          echo "已回挂到 pigeonbox/pigeonbox Releases"

      - name: 回调 hub 列车编排器(唤醒 advance 核对完成度;回调丢失由 hub 15 分钟 sweep 兜底,不阻断发布)
        env:
          CB_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
          TAG: qnap-${{ inputs.version || github.ref_name }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $CB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pigeonbox/pigeonbox/dispatches \
            -d "{\"event_type\":\"train-advance\",\"client_payload\":{\"component\":\"qnap\",\"tag\":\"$TAG\"}}" \
            || echo "::warning::hub 回调失败(train-orchestrator sweep 兜底)"
