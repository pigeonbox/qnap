QPKG_NAME="PigeonBox"
QPKG_DISPLAY_NAME="PigeonBox 文件快递柜"
QPKG_VER="__VERSION__"
QPKG_AUTHOR="PigeonBox"
QPKG_LICENSE="Apache-2.0"
QPKG_SUMMARY="匿名口令分享文本与文件:寄件生成口令,对方凭口令取件,到期自动销毁"
# 服务脚本路径(相对包根):设置后 App Center 才显示启动/停止按钮
QPKG_SERVICE_PROGRAM="pigeonbox.sh"
# 原生进程模式(包内自带静态二进制+前端),无外部依赖:免 Container Station/免 Docker
# QTS_MINI_VERSION 放宽到 4.5.0——Container Station 3 需 QTS 5,原生模式正好解锁
# 跑不了 CS3 的 QTS 4.5 老机型(4.5 未真机验证,见 README)
QTS_MINI_VERSION="4.5.0"
# 开机启动序号(排在网络/存储之后)
QPKG_RC_NUM="199"
# 启动/停止超时:原生启动秒级,放大只为慢盘首启 SQLite 迁移留余量
QPKG_TIMEOUT="120,60"
# App Center 图标/主菜单打开 http://<NAS>:<Web_Port>/(服务脚本会随 .env 端口同步改写)
QPKG_WEBUI="/"
QPKG_WEB_PORT="12345"
QPKG_VISIBLE="2"
# 非 PGM 商店分发(手动安装场景,跳过商店 XML 兼容检查)
QPKG_DISTRIBUTION_TYPE="1"
# 构建期目录映射(shared 内容 QDK 平铺到包根;bin 按架构目录打包)
QDK_DATA_DIR_ICONS="icons"
QDK_DATA_DIR_SHARED="shared"
QDK_DATA_DIR_X86_64="x86_64"
QDK_DATA_DIR_ARM_64="arm_64"
