QPKG_NAME="FilesCodeBox"
QPKG_DISPLAY_NAME="FilesCodeBox 文件快递柜"
QPKG_VER="__VERSION__"
QPKG_AUTHOR="FilesCodeBox"
QPKG_LICENSE="Apache-2.0"
QPKG_SUMMARY="匿名口令分享文本与文件:寄件生成口令,对方凭口令取件,到期自动销毁"
# 服务脚本路径(相对包根):设置后 App Center 才显示启动/停止按钮
QPKG_SERVICE_PROGRAM="filecodebox.sh"
# 依赖 Container Station 3(QTS 5 内置;docker/compose 由其提供)
QPKG_REQUIRE="container-station >= 3.0"
QTS_MINI_VERSION="5.0.0"
# 开机启动序号(排在 Container Station 之后);超时放大:首启需拉镜像
QPKG_RC_NUM="199"
QPKG_TIMEOUT="180,180"
# App Center 图标/主菜单打开 http://<NAS>:<Web_Port>/(服务脚本会随 .env 端口同步改写)
QPKG_WEBUI="/"
QPKG_WEB_PORT="12345"
QPKG_VISIBLE="2"
# 非 PGM 商店分发(手动安装场景,跳过商店 XML 兼容检查)
QPKG_DISTRIBUTION_TYPE="1"
# 构建期目录映射(payload 均为架构无关的脚本+编排)
QDK_DATA_DIR_ICONS="icons"
QDK_DATA_DIR_SHARED="shared"
QDK_DATA_DIR_X86_64="x86_64"
QDK_DATA_DIR_ARM_64="arm_64"
